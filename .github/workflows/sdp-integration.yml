name: OpenText Software Delivery Platform Integration

on:
  workflow_run:
    workflows: ["CSDP Demo Pipeline"]
    types: [requested, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  sdp_integration_job:
    runs-on: ubuntu-latest
    name: SDP-Integration#${{github.event.action}}#${{github.event.workflow_run.id}}

    steps:
      - name: Publish to OpenText SDP
        uses: opentext/sdp-github-actions-integration@v26.4.0
        id: gitHubActionsIntegration
        with:
          octaneUrl: 'https://almoctane-eur.saas.microfocus.com'
          octaneSharedSpace: 416002
          octaneWorkspace: 2028
          octaneClientId: ${{secrets.SDP_CLIENT_ID}}
          octaneClientSecret: ${{secrets.SDP_CLIENT_SECRET}}
          githubToken: ${{secrets.GITHUB_TOKEN}}
          serverBaseUrl: 'https://github.com/quickerz/QUFTPlayGround'
          pipelineNamePattern: '${workflow_name}'
          logLevel: '2'
